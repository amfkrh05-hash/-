<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알파벳 음가 퀴즈 게임 (Alphabet Phonics Quiz)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Jua', sans-serif;
            background: linear-gradient(135deg, #a8edf8 0%, #fed6e3 100%);
            min-height: 100vh;
        }
        .pop-hover {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pop-hover:hover {
            transform: scale(1.05) translateY(-4px);
        }
        .pop-hover:active {
            transform: scale(0.95);
        }
        .glow-effect {
            box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.5), 0 8px 10px -6px rgba(255, 182, 193, 0.5);
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-short {
            animation: bounce-short 0.6s ease infinite;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 4px solid #ffffff;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-8 min-h-screen">

    <!-- Top Header & Scoreboard -->
    <header class="w-full max-w-2xl flex justify-between items-center glass-card rounded-3xl p-4 shadow-xl mb-4">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🔤</span>
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-indigo-600">파닉스 알파벳 퀴즈</h1>
                <p class="text-xs text-gray-500 font-sans">Alphabet Phonics Master</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-center bg-yellow-100 px-3 py-1 rounded-2xl border-2 border-yellow-300">
                <span class="text-xs text-yellow-700 block font-bold">점수</span>
                <span id="score" class="text-xl font-bold text-yellow-600">0</span>
            </div>
            <div class="text-center bg-purple-100 px-3 py-1 rounded-2xl border-2 border-purple-300">
                <span class="text-xs text-purple-700 block font-bold">연속</span>
                <span id="streak" class="text-xl font-bold text-purple-600">0 🔥</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-2xl flex-1 flex flex-col justify-center items-center">

        <!-- Game Mode Selection Screen -->
        <div id="mode-screen" class="w-full glass-card rounded-3xl p-6 shadow-2xl text-center space-y-6">
            <h2 class="text-2xl font-bold text-purple-700 mb-2">게임 모드를 선택하세요! 🎮</h2>
            <p class="text-gray-600 mb-6">원하는 방식을 골라 재미있게 파닉스를 배워보세요.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="startGame('soundToLetter')" class="pop-hover bg-gradient-to-r from-pink-400 to-rose-400 text-white p-6 rounded-2xl shadow-lg text-left flex flex-col justify-between h-36 border-b-4 border-rose-600">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-3xl">🔊 ➔ 🅰️</span>
                        <span class="bg-white/30 text-xs px-2 py-1 rounded-full font-bold">기본</span>
                    </div>
                    <div>
                        <div class="font-bold text-lg">소리 듣고 알파벳 맞추기</div>
                        <div class="text-xs text-pink-100 mt-1">음가 소리를 듣고 맞는 알파벳을 찾아요!</div>
                    </div>
                </button>

                <button onclick="startGame('wordToLetter')" class="pop-hover bg-gradient-to-r from-cyan-400 to-blue-400 text-white p-6 rounded-2xl shadow-lg text-left flex flex-col justify-between h-36 border-b-4 border-blue-600">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-3xl">🍎 ➔ 🅰️</span>
                        <span class="bg-white/30 text-xs px-2 py-1 rounded-full font-bold">단어</span>
                    </div>
                    <div>
                        <div class="font-bold text-lg">단어와 첫소리 맞추기</div>
                        <div class="text-xs text-cyan-100 mt-1">그림과 단어를 보고 시작하는 음가를 찾아봐요!</div>
                    </div>
                </button>
            </div>

            <!-- Phonics Chart Quick Access -->
            <button onclick="openChartModal()" class="w-full mt-4 bg-emerald-400 hover:bg-emerald-500 text-white font-bold py-3 rounded-2xl transition shadow-md border-b-4 border-emerald-600 flex items-center justify-center space-x-2">
                <i class="fas fa-book-open"></i>
                <span>전체 알파벳 파닉스 표 공부하기</span>
            </button>
        </div>

        <!-- Quiz Play Screen (Hidden by default) -->
        <div id="quiz-screen" class="w-full glass-card rounded-3xl p-6 shadow-2xl flex flex-col items-center space-y-6 hidden">
            <!-- Progress Bar & Question Counter -->
            <div class="w-full flex justify-between items-center text-sm font-bold text-gray-500 mb-1">
                <span id="question-count">문제 1 / 10</span>
                <button onclick="backToMenu()" class="text-gray-400 hover:text-gray-600 text-xs underline">메뉴로 나가기</button>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
            </div>

            <!-- Dynamic Question Prompt Area -->
            <div class="w-full bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center relative min-h-[180px]">
                
                <!-- Audio Play Button Prompt -->
                <div id="audio-prompt-container" class="flex flex-col items-center space-y-3">
                    <button id="listen-btn" onclick="playQuestionSound()" class="pop-hover bg-indigo-500 hover:bg-indigo-600 text-white w-20 h-20 rounded-full flex items-center justify-center shadow-lg border-b-4 border-indigo-700 animate-bounce-short">
                        <i class="fas fa-volume-up text-3xl"></i>
                    </button>
                    <span class="text-sm font-bold text-indigo-700">버튼을 눌러 소리를 들어보세요!</span>
                </div>

                <!-- Word & Picture Prompt (Hidden depending on mode) -->
                <div id="word-prompt-container" class="flex flex-col items-center space-y-2 hidden">
                    <span id="word-emoji" class="text-6xl"></span>
                    <h2 id="word-display" class="text-3xl font-extrabold text-indigo-800 tracking-wider"></h2>
                    <p class="text-xs text-indigo-500 font-bold">이 단어의 첫 번째 발음은 무엇일까요?</p>
                </div>
            </div>

            <!-- Options Grid -->
            <div id="options-grid" class="grid grid-cols-2 gap-4 w-full">
                <!-- Option buttons dynamically generated by JS -->
            </div>

            <!-- Feedback Message -->
            <div id="feedback-msg" class="h-8 text-center font-bold text-lg"></div>
        </div>

        <!-- Result Screen (Hidden by default) -->
        <div id="result-screen" class="w-full glass-card rounded-3xl p-8 shadow-2xl text-center space-y-6 hidden">
            <div class="text-6xl animate-bounce">🏆</div>
            <h2 class="text-3xl font-extrabold text-indigo-700">참 잘했어요!</h2>
            <p id="final-stats" class="text-gray-600 text-lg"></p>
            
            <div class="bg-indigo-50 rounded-2xl p-4 border border-indigo-100">
                <span class="text-xs text-indigo-400 block font-bold mb-1">최종 점수</span>
                <span id="final-score" class="text-4xl font-extrabold text-indigo-600">0점</span>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button onclick="restartGame()" class="flex-1 bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-teal-700 pop-hover">
                    다시 도전하기 🔄
                </button>
                <button onclick="backToMenu()" class="flex-1 bg-gradient-to-r from-gray-400 to-slate-500 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-slate-700 pop-hover">
                    메뉴로 이동 🏠
                </button>
            </div>
        </div>
    </main>

    <!-- Phonics Chart Modal -->
    <div id="chart-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border-4 border-purple-200">
            <div class="p-4 border-b flex justify-between items-center bg-purple-50 rounded-t-2xl">
                <h3 class="text-xl font-bold text-purple-700">🔤 알파벳 음가(Phonics) 공부표</h3>
                <button onclick="closeChartModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div id="chart-content" class="p-4 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <!-- Dynamically populated chart tiles -->
            </div>
        </div>
    </div>

    <script>
        // Phonics Dataset with letters, phonics sounds description, example words, and emojis
        const phonicsData = [
            { letter: 'A', soundDesc: '아 / 에 [æ]', word: 'Apple', emoji: '🍎', soundText: 'A, /æ/ sound in Apple' },
            { letter: 'B', soundDesc: '브 [b]', word: 'Banana', emoji: '🍌', soundText: 'B, /b/ sound in Banana' },
            { letter: 'C', soundDesc: '크 [k]', word: 'Cat', emoji: '🐱', soundText: 'C, /k/ sound in Cat' },
            { letter: 'D', soundDesc: '드 [d]', word: 'Dog', emoji: '🐶', soundText: 'D, /d/ sound in Dog' },
            { letter: 'E', soundDesc: '에 [e]', word: 'Elephant', emoji: '🐘', soundText: 'E, /e/ sound in Elephant' },
            { letter: 'F', soundDesc: '프 [f]', word: 'Fish', emoji: '🐟', soundText: 'F, /f/ sound in Fish' },
            { letter: 'G', soundDesc: '그 [ɡ]', word: 'Gorilla', emoji: '🦍', soundText: 'G, /ɡ/ sound in Gorilla' },
            { letter: 'H', soundDesc: '흐 [h]', word: 'Hat', emoji: '🎩', soundText: 'H, /h/ sound in Hat' },
            { letter: 'I', soundDesc: '이 [ɪ]', word: 'Igloo', emoji: '⛺', soundText: 'I, /ɪ/ sound in Igloo' },
            { letter: 'J', soundDesc: '즈 [dʒ]', word: 'Juice', emoji: '🧃', soundText: 'J, /dʒ/ sound in Juice' },
            { letter: 'K', soundDesc: '크 [k]', word: 'Kangaroo', emoji: '🦘', soundText: 'K, /k/ sound in Kangaroo' },
            { letter: 'L', soundDesc: '르 [l]', word: 'Lion', emoji: '🦁', soundText: 'L, /l/ sound in Lion' },
            { letter: 'M', soundDesc: '므 [m]', word: 'Monkey', emoji: '🐵', soundText: 'M, /m/ sound in Monkey' },
            { letter: 'N', soundDesc: '느 [n]', word: 'Nest', emoji: '🪹', soundText: 'N, /n/ sound in Nest' },
            { letter: 'O', soundDesc: '아 [ɒ]', word: 'Octopus', emoji: '🐙', soundText: 'O, /ɒ/ sound in Octopus' },
            { letter: 'P', soundDesc: '프 [p]', word: 'Pig', emoji: '🐷', soundText: 'P, /p/ sound in Pig' },
            { letter: 'Q', soundDesc: '쿠 [kw]', word: 'Queen', emoji: '👑', soundText: 'Q, /kw/ sound in Queen' },
            { letter: 'R', soundDesc: '르 [r]', word: 'Rabbit', emoji: '🐰', soundText: 'R, /r/ sound in Rabbit' },
            { letter: 'S', soundDesc: '스 [s]', word: 'Sun', emoji: '☀️', soundText: 'S, /s/ sound in Sun' },
            { letter: 'T', soundDesc: '트 [t]', word: 'Tiger', emoji: '🐯', soundText: 'T, /t/ sound in Tiger' },
            { letter: 'U', soundDesc: '어 [ʌ]', word: 'Umbrella', emoji: '☂️', soundText: 'U, /ʌ/ sound in Umbrella' },
            { letter: 'V', soundDesc: '브 [v]', word: 'Van', emoji: '🚐', soundText: 'V, /v/ sound in Van' },
            { letter: 'W', soundDesc: '우 [w]', word: 'Water', emoji: '💧', soundText: 'W, /w/ sound in Water' },
            { letter: 'X', soundDesc: '크스 [ks]', word: 'Xylophone', emoji: '🎼', soundText: 'X, /ks/ sound in Xylophone' },
            { letter: 'Y', soundDesc: '이 [j]', word: 'Yo-yo', emoji: '🪀', soundText: 'Y, /j/ sound in Yoyo' },
            { letter: 'Z', soundDesc: '즈 [z]', word: 'Zebra', emoji: '🦓', soundText: 'Z, /z/ sound in Zebra' }
        ];

        let currentMode = '';
        let currentQuestionIndex = 0;
        let score = 0;
        let streak = 0;
        let activeQuestions = [];
        let currentTarget = null;
        let isAnsweringAllowed = true;

        const TOTAL_QUESTIONS = 10;

        // Speech Synthesis setup
        const synth = window.speechSynthesis;

        function speak(text, rate = 0.85) {
            if (!synth) return;
            synth.cancel(); // Cancel current audio queue
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = rate;
            utterance.pitch = 1.1;
            synth.speak(utterance);
        }

        function startGame(mode) {
            currentMode = mode;
            score = 0;
            streak = 0;
            currentQuestionIndex = 0;
            updateScoreboard();

            // Shuffle and pick TOTAL_QUESTIONS
            activeQuestions = [...phonicsData].sort(() => 0.5 - Math.random()).slice(0, TOTAL_QUESTIONS);

            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            loadQuestion();
        }

        function backToMenu() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('mode-screen').classList.remove('hidden');
            if (synth) synth.cancel();
        }

        function restartGame() {
            startGame(currentMode);
        }

        function updateScoreboard() {
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = `${streak} 🔥`;
        }

        function loadQuestion() {
            isAnsweringAllowed = true;
            document.getElementById('feedback-msg').innerText = '';
            
            currentTarget = activeQuestions[currentQuestionIndex];

            // Update Progress UI
            const progressPct = ((currentQuestionIndex) / TOTAL_QUESTIONS) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;
            document.getElementById('question-count').innerText = `문제 ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;

            // Adjust Prompt Layout based on Mode
            const audioPrompt = document.getElementById('audio-prompt-container');
            const wordPrompt = document.getElementById('word-prompt-container');

            if (currentMode === 'soundToLetter') {
                audioPrompt.classList.remove('hidden');
                wordPrompt.classList.add('hidden');
                // Auto play sound after slight delay
                setTimeout(() => playQuestionSound(), 300);
            } else {
                audioPrompt.classList.add('hidden');
                wordPrompt.classList.remove('hidden');
                document.getElementById('word-emoji').innerText = currentTarget.emoji;
                // Highlight first letter placeholder
                const hiddenWord = `<span class="text-rose-500 underline font-extrabold">_</span>${currentTarget.word.slice(1)}`;
                document.getElementById('word-display').innerHTML = hiddenWord;
                // Read word automatically
                speak(currentTarget.word);
            }

            // Prepare Options (Correct answer + 3 wrong choices)
            const distractors = phonicsData
                .filter(item => item.letter !== currentTarget.letter)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);

            const options = [...distractors, currentTarget].sort(() => 0.5 - Math.random());

            // Render Options
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'pop-hover bg-white hover:bg-indigo-50 text-indigo-900 border-4 border-indigo-200 rounded-2xl py-6 flex flex-col items-center justify-center font-extrabold shadow-md transition-all text-2xl';
                btn.innerHTML = `
                    <span>${option.letter}</span>
                    <span class="text-xs text-gray-400 mt-1 font-normal">${option.soundDesc}</span>
                `;
                btn.onclick = () => checkAnswer(option.letter, btn);
                grid.appendChild(btn);
            });
        }

        function playQuestionSound() {
            if (currentTarget) {
                // Speak phonics letter sound
                speak(`${currentTarget.letter}, ${currentTarget.letter}`);
            }
        }

        function checkAnswer(selectedLetter, buttonElement) {
            if (!isAnsweringAllowed) return;
            isAnsweringAllowed = false;

            const isCorrect = selectedLetter === currentTarget.letter;
            const feedbackEl = document.getElementById('feedback-msg');

            if (isCorrect) {
                score += 10 + (streak * 2); // Bonus score for streak
                streak++;
                buttonElement.classList.remove('border-indigo-200', 'bg-white');
                buttonElement.classList.add('bg-emerald-400', 'text-white', 'border-emerald-600');
                feedbackEl.innerHTML = `<span class="text-emerald-600">🎉 정답입니다! (${currentTarget.letter} - ${currentTarget.soundDesc})</span>`;
                speak(`Correct! ${currentTarget.letter} for ${currentTarget.word}`);
            } else {
                streak = 0;
                buttonElement.classList.remove('border-indigo-200', 'bg-white');
                buttonElement.classList.add('bg-rose-400', 'text-white', 'border-rose-600');
                feedbackEl.innerHTML = `<span class="text-rose-600">❌ 아쉬워요! 정답은 '${currentTarget.letter}' 이었어요.</span>`;
                speak(`Oops! It is ${currentTarget.letter}`);
            }

            updateScoreboard();

            // Transition to Next Question
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < TOTAL_QUESTIONS) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1800);
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = `${score}점`;
            document.getElementById('final-stats').innerText = `총 ${TOTAL_QUESTIONS}문제 중 성공적으로 파닉스를 마스터하셨습니다!`;

            speak(`Great job! You scored ${score} points.`);
        }

        function openChartModal() {
            const chartContent = document.getElementById('chart-content');
            chartContent.innerHTML = '';

            phonicsData.forEach(item => {
                const tile = document.createElement('div');
                tile.className = 'pop-hover bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-3 flex flex-col items-center justify-center cursor-pointer text-center';
                tile.onclick = () => speak(`${item.letter}, ${item.word}`);
                tile.innerHTML = `
                    <span class="text-2xl font-bold text-indigo-700">${item.letter}</span>
                    <span class="text-2xl my-1">${item.emoji}</span>
                    <span class="text-xs font-semibold text-gray-700">${item.word}</span>
                    <span class="text-[10px] text-indigo-500 mt-1">${item.soundDesc}</span>
                `;
                chartContent.appendChild(tile);
            });

            document.getElementById('chart-modal').classList.remove('hidden');
        }

        function closeChartModal() {
            document.getElementById('chart-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
